<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Braquage - vue de dessus</title>
<style>
  :root{
    --bg:#11151c; --panel:#1a2029; --ink:#e7edf3; --muted:#8a97a6;
    --ok:#37d67a; --warn:#f5a623; --bad:#ff5964; --accent:#4aa3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden}
  .wrap{display:flex; flex-direction:column; height:100%; max-width:860px; margin:0 auto; padding:8px}
  header{display:flex; align-items:baseline; gap:10px; padding:2px 4px 6px; flex-wrap:wrap}
  header h1{font-size:16px; margin:0; font-weight:650}
  header .sub{font-size:12px; color:var(--muted)}
  /* barre de reglage vitesse */
  .ctrlbar{display:flex; align-items:center; gap:10px; padding:2px 4px 6px; font-size:12px; color:var(--muted)}
  .ctrlbar input[type=range]{flex:1; max-width:280px; accent-color:var(--accent)}
  .ctrlbar b{color:var(--ink)}
  .stage{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  canvas{width:100%; height:auto; max-height:100%; background:#243019; border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.4); touch-action:none}
  #banner{position:absolute; top:12px; left:50%; transform:translateX(-50%);
    padding:8px 16px; border-radius:999px; font-weight:700; font-size:15px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); opacity:0; transition:opacity .2s; white-space:nowrap; max-width:94%; text-align:center}
  #banner.show{opacity:1}
  #banner.ok{color:var(--ok)} #banner.warn{color:var(--warn)} #banner.bad{color:var(--bad)}
  #hud{position:absolute; top:12px; right:14px; font-size:12px; color:var(--muted); text-align:right; line-height:1.5}
  #hud b{color:var(--ink); font-size:15px}
  .legend{display:flex; flex-wrap:wrap; gap:10px 16px; padding:8px 6px 2px; font-size:11.5px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .dot{width:11px; height:11px; border-radius:3px; display:inline-block}
  .pad{display:none; justify-content:space-between; padding:10px 4px 4px; gap:14px}
  .pad .cluster{display:flex; gap:14px}
  .btn{width:76px; height:76px; border-radius:20px; border:1px solid #2b333f; background:var(--panel);
    color:var(--ink); font-size:26px; display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:none; font-weight:700}
  .btn:active,.btn.on{background:#2b3644; border-color:var(--accent)}
  .btn.small{width:64px; height:64px; font-size:13px; border-radius:16px}
  footer{font-size:11px; color:var(--muted); text-align:center; padding:6px 0 2px}
  @media (pointer:coarse){ .pad{display:flex} }
  kbd{background:#2b333f; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Le bon moment pour braquer</h1>
    <span class="sub">demi-tour sec : trop tôt = tu coupes l'intérieur · trop tard = tu pars large</span>
  </header>

  <div class="ctrlbar">
    <label for="vmax">Vitesse max</label>
    <input id="vmax" type="range" min="1.5" max="6" step="0.1" value="3.2">
    <b id="vmaxval">176 km/h</b>
  </div>

  <div class="stage">
    <canvas id="c" width="800" height="600"></canvas>
    <div id="banner"></div>
    <div id="hud"><b id="spd">0</b> km/h<br><span id="hint">avance vers le demi-tour</span></div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:#4aa3ff"></i>trajectoire idéale</span>
    <span><i class="dot" style="background:#f5a623"></i>point de braquage</span>
    <span><i class="dot" style="background:#ff5964"></i>corde (apex)</span>
    <span><i class="dot" style="background:#37d67a"></i>sortie</span>
    <span><i class="dot" style="background:#e7edf3"></i>ta trace</span>
  </div>

  <div class="pad">
    <div class="cluster">
      <div class="btn" data-k="left">◀</div>
      <div class="btn" data-k="right">▶</div>
    </div>
    <div class="cluster">
      <div class="btn small" data-k="reset">RESET</div>
      <div class="btn" data-k="down">▼</div>
      <div class="btn" data-k="up">▲</div>
    </div>
  </div>

  <footer>Clavier : <kbd>↑</kbd> accélérer · <kbd>↓</kbd> freiner · <kbd>←</kbd> <kbd>→</kbd> braquer · <kbd>R</kbd> recommencer</footer>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const banner = document.getElementById('banner');
const spdEl = document.getElementById('spd'), hintEl = document.getElementById('hint');

/* ---------- Reglage vitesse max ---------- */
let MAXSPEED = 3.2;
const vmax = document.getElementById('vmax'), vmaxval = document.getElementById('vmaxval');
function syncVmax(){ MAXSPEED = parseFloat(vmax.value); vmaxval.textContent = Math.round(MAXSPEED*55)+' km/h'; }
vmax.addEventListener('input', syncVmax); syncVmax();

/* ---------- Piste : demi-tour (hairpin) ---------- */
const halfWidth = 48;
const HC = {x:560, y:310}, HR = 70;   // centre et rayon du demi-tour
const APP_Y = 240, EXIT_Y = 380;      // droites d'approche (haut) et de sortie (bas)
function buildCenterline(){
  const pts=[];
  for(let x=120;x<=560;x+=4) pts.push({x, y:APP_Y});                 // approche (vers l'est)
  for(let a=-90;a<=90;a+=3){ const r=a*Math.PI/180; pts.push({x:HC.x+HR*Math.cos(r), y:HC.y+HR*Math.sin(r)}); } // demi-tour par la droite
  for(let x=560;x>=120;x-=4) pts.push({x, y:EXIT_Y});               // sortie (vers l'ouest)
  return pts;
}
const CENTER = buildCenterline();

// Repères
const TURNIN = {x:550, y:222};   // braque ici (tard et sec, propre au hairpin)
const APEX   = {x:600, y:310};   // corde, à l'intérieur du demi-tour
const EXIT   = {x:500, y:398};   // sortie
const IDEAL_TURN_X = 550, TURN_TOL = 38;

const IDEAL = [
  {x:120,y:200},{x:420,y:206},{x:500,y:216},{x:545,y:232},
  {x:585,y:258},{x:612,y:285},{x:620,y:310},   // apex (point le plus à droite)
  {x:612,y:335},{x:585,y:362},{x:545,y:378},
  {x:500,y:392},{x:320,y:404},{x:120,y:408}
];

function distToPath(x,y,path){
  let m=1e9; for(const p of path){ const dx=x-p.x, dy=y-p.y, d=dx*dx+dy*dy; if(d<m)m=d; } return Math.sqrt(m);
}

/* ---------- Voiture ---------- */
const START = {x:120, y:APP_Y, heading:0};
let car, trail, state;
function reset(){
  car = {x:START.x, y:START.y, heading:START.heading, speed:0, steer:0};
  trail = [];
  state = {turnInX:null, apexMin:1e9, offTrack:false, resultShown:false};
  demoTurning = false;
  showBanner('', '');
  hintEl.textContent = 'avance vers le demi-tour';
}

/* ---------- Mode démo (pilotage auto pour capture) ---------- */
const DEMO = new URLSearchParams(location.search).get('demo'); // early | good | late
const DEMO_TURN_X = {early:470, good:555, late:625}[DEMO];
let demoTurning = false, demoSteer = 0;
function demoDrive(){
  const cruise = Math.min(1.9, MAXSPEED);
  keys.up = car.speed < cruise; keys.down = false; keys.left = false; keys.right = false;
  if(car.x >= DEMO_TURN_X) demoTurning = true;
  // demi-tour à DROITE : correcteur qui vise le cap ouest (180°), sans dépasser
  if(demoTurning){ const err = Math.PI - car.heading; demoSteer = Math.max(0, Math.min(0.40, err*1.5)); }
  else demoSteer = 0;
}

/* ---------- Entrées ---------- */
const keys = {up:false, down:false, left:false, right:false};
reset();
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'||k==='z'){keys.up=true;e.preventDefault();}
  else if(k==='arrowdown'||k==='s'){keys.down=true;e.preventDefault();}
  else if(k==='arrowleft'||k==='a'||k==='q'){keys.left=true;e.preventDefault();}
  else if(k==='arrowright'||k==='d'){keys.right=true;e.preventDefault();}
  else if(k==='r'){reset();}
});
addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'||k==='z')keys.up=false;
  else if(k==='arrowdown'||k==='s')keys.down=false;
  else if(k==='arrowleft'||k==='a'||k==='q')keys.left=false;
  else if(k==='arrowright'||k==='d')keys.right=false;
});
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault(); if(k==='reset'){reset();return;} keys[k]=true; b.classList.add('on');};
  const off=e=>{e.preventDefault(); if(k!=='reset'){keys[k]=false; b.classList.remove('on');}};
  b.addEventListener('touchstart',on,{passive:false});
  b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});

/* ---------- Feedback ---------- */
function showBanner(txt, cls){ banner.textContent = txt; banner.className = txt ? 'show '+cls : ''; }

/* ---------- Physique ---------- */
function update(){
  if(DEMO_TURN_X!==undefined) demoDrive();

  if(keys.up)   car.speed += 0.09;
  if(keys.down) car.speed -= 0.14;
  car.speed *= 0.992;
  if(!keys.up && !keys.down) car.speed *= 0.985;
  car.speed = Math.max(-1.4, Math.min(MAXSPEED, car.speed));

  const target = (DEMO_TURN_X!==undefined) ? demoSteer : (keys.left?-1:0) + (keys.right?1:0);
  car.steer += (target - car.steer) * 0.18;

  car.heading += car.steer * car.speed * 0.036;   // rayon constant à braquage constant
  car.x += Math.cos(car.heading) * car.speed;
  car.y += Math.sin(car.heading) * car.speed;

  const d = distToPath(car.x, car.y, CENTER);
  state.offTrack = d > halfWidth;
  if(state.offTrack) car.speed *= 0.90;

  if(Math.abs(car.speed) > 0.15){ trail.push({x:car.x, y:car.y, off:state.offTrack}); if(trail.length>1600) trail.shift(); }

  // --- Analyse du braquage ---
  const inApproach = car.y < 300 && car.x > 150 && car.x < 680;
  if(inApproach && state.turnInX===null && Math.abs(car.steer)>0.12 && car.speed>0.5){
    state.turnInX = car.x;
    if(car.x < IDEAL_TURN_X - TURN_TOL) showBanner('Tu braques trop TÔT', 'warn');
    else if(car.x > IDEAL_TURN_X + TURN_TOL) showBanner('Tu braques trop TARD', 'bad');
    else showBanner('Bon point de braquage', 'ok');
  }
  if(car.x > 520){ const da = Math.hypot(car.x-APEX.x, car.y-APEX.y); if(da < state.apexMin) state.apexMin = da; }

  if(!state.resultShown && car.y > 340 && car.x < 500){ state.resultShown = true; finalVerdict(); }

  spdEl.textContent = Math.round(Math.abs(car.speed)*55);
  if(!state.resultShown){
    if(car.y<300 && car.x<470) hintEl.textContent='patiente, ne braque pas trop tôt';
    else if(car.y<300) hintEl.textContent='c\'est le moment de braquer, et sec';
    else hintEl.textContent='vise la corde puis élargis';
  }
}

function finalVerdict(){
  let msg, cls; const t = state.turnInX;
  if(t===null){ msg='Tu n\'as pas tourné'; cls='bad'; }
  else if(t < IDEAL_TURN_X - TURN_TOL){ msg='Trop tôt : tu coupes l\'intérieur et tu ressors large. Attends le repère orange.'; cls='warn'; }
  else if(t > IDEAL_TURN_X + TURN_TOL){ msg='Trop tard : tu pars large et tu manques la corde. Braque plus tôt et plus sec.'; cls='bad'; }
  else if(state.apexMin < 45){ msg='Parfait : bon braquage, corde touchée.'; cls='ok'; }
  else { msg='Bon timing mais tu passes loin de la corde.'; cls='warn'; }
  showBanner(msg, cls);
  hintEl.textContent='appuie sur R / RESET pour recommencer';
}

/* ---------- Rendu ---------- */
function pathTo(path){ ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x,path[i].y); }

function drawTrack(){
  ctx.fillStyle='#2f3d1f'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#33421f'; for(let i=0;i<40;i++) ctx.fillRect((i*97)%W,(i*53)%H,3,3);
  ctx.lineCap='round'; ctx.lineJoin='round';
  pathTo(CENTER); ctx.strokeStyle='#c9ccd1'; ctx.lineWidth=2*halfWidth+10; ctx.stroke();
  pathTo(CENTER); ctx.strokeStyle='#3a4048'; ctx.lineWidth=2*halfWidth; ctx.stroke();
  pathTo(CENTER); ctx.strokeStyle='rgba(240,210,80,.35)'; ctx.lineWidth=2; ctx.setLineDash([12,14]); ctx.stroke(); ctx.setLineDash([]);

  ctx.beginPath(); ctx.moveTo(IDEAL[0].x,IDEAL[0].y);
  for(let i=1;i<IDEAL.length-1;i++){ const xc=(IDEAL[i].x+IDEAL[i+1].x)/2, yc=(IDEAL[i].y+IDEAL[i+1].y)/2; ctx.quadraticCurveTo(IDEAL[i].x,IDEAL[i].y,xc,yc);}
  ctx.strokeStyle='rgba(74,163,255,.9)'; ctx.lineWidth=3; ctx.setLineDash([9,9]); ctx.stroke(); ctx.setLineDash([]);

  cone(TURNIN,'#f5a623','braque ici');
  cone(APEX,'#ff5964','corde');
  cone(EXIT,'#37d67a','sortie');
}
function cone(p,color,label){
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p.x,p.y,7,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, p.x, p.y-12);
}

function drawTrail(){
  if(trail.length<2) return;
  ctx.lineWidth=4; ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y);
    ctx.strokeStyle = trail[i].off ? 'rgba(255,89,100,.9)' : 'rgba(231,237,243,.85)';
    ctx.stroke();
  }
}

function drawCar(){
  ctx.save(); ctx.translate(car.x,car.y); ctx.rotate(car.heading);
  // ombre
  ctx.fillStyle='rgba(0,0,0,.3)'; roundRect(-23,-14,46,28,7); ctx.fill();
  // roues (grosses, bien visibles)
  ctx.fillStyle='#0c0c0c';
  wheel(16,-15,car.steer); wheel(16,15,car.steer);   // avant, braquées
  wheel(-16,-15,0);        wheel(-16,15,0);           // arrière
  // carrosserie
  const g=ctx.createLinearGradient(-22,0,22,0); g.addColorStop(0,'#ff7b54'); g.addColorStop(1,'#ff4d4d');
  ctx.fillStyle=g; roundRect(-22,-13,44,26,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1.5; ctx.stroke();
  // pare-brise + capot
  ctx.fillStyle='rgba(20,30,45,.9)'; roundRect(3,-9,10,18,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)'; roundRect(-18,-9,7,18,3); ctx.fill();
  ctx.restore();
}
function wheel(x,y,steer){ ctx.save(); ctx.translate(x,y); ctx.rotate(steer*0.5); roundRect(-7,-4,14,8,2.5); ctx.fill(); ctx.restore(); }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function render(){ ctx.clearRect(0,0,W,H); drawTrack(); drawTrail(); drawCar(); }
function loop(){ update(); render(); requestAnimationFrame(loop); }

if(DEMO_TURN_X!==undefined){ for(let i=0;i<560;i++) update(); render(); }
else loop();
</script>
</body>
</html>
